<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="bar">
      <button type="button" data-toggle="left" aria-label="Show or hide projects">Projects</button>
      <span id="bar-title">Desk</span>
      <button type="button" data-toggle="right" aria-label="Show or hide chat">Chat</button>
    </header>
    <div id="layout">
      <aside id="pane-left" class="pane" aria-label="Projects"></aside>
      <main id="pane-centre" class="pane" aria-label="Page"></main>
      <aside id="pane-right" class="pane" aria-label="Chat">
        <header class="chathead">
          <span id="chat-where">Chat</span>
          <button id="chat-stop" type="button">Stop</button>
        </header>
        <div id="chat-log"></div>
        <div id="chat-row">
          <input id="chat-input" type="text" autocomplete="off" placeholder="Ask about your desk" />
          <button id="chat-send" type="button">Send</button>
        </div>
      </aside>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
